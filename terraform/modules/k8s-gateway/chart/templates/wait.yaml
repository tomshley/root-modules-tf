apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.waitName }}
  labels: {{ .Values.labels | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.waitName }}
  labels: {{ .Values.labels | toJson }}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    resourceNames: [{{ .Values.gateway | quote }}]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.waitName }}
  labels: {{ .Values.labels | toJson }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.waitName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.waitName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.waitName }}
  labels: {{ .Values.labels | toJson }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ int .Values.timeout }}
  backoffLimit: 0
  template:
    metadata:
      labels: {{ .Values.labels | toJson }}
    spec:
      serviceAccountName: {{ .Values.waitName }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wait
          image: {{ .Values.waitImage | quote }}
          command: ["kubectl"]
          args: ["wait", "--namespace={{ .Release.Namespace }}", "--for=condition=Programmed", "--timeout={{ int .Values.timeout }}s", "gateways.gateway.networking.k8s.io/{{ .Values.gateway }}"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: cache
              mountPath: /tmp
          env:
            - name: HOME
              value: /tmp
      volumes:
        - name: cache
          emptyDir: {}
